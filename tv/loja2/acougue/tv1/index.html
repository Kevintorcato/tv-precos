<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WR Supermercado - Ofertas</title>
<style>
:root{--azul:#0b3fa8;--azul-esc:#082a73;--azul-txt:#0a2a66;--amarelo:#ffc400;--amarelo-claro:#ffd83a;--vermelho:#d81f26;}
@font-face{font-family:'Pincel';src:url('https://raw.githubusercontent.com/Kevintorcato/tv-precos/main/assets/fonts/PermanentMarker.ttf') format('truetype');font-display:swap;}
@keyframes pisca{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.1);}}
*{margin:0;padding:0;box-sizing:border-box;}
#desliga{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;display:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:none;}
body{background:linear-gradient(160deg,var(--azul),var(--azul-esc));}

#banner{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--azul),var(--azul-esc));}
#banner .logobox{background:#fff;border-radius:3vh;padding:6vh 7vw;box-shadow:0 1.5vh 5vh rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
#banner .logobox img{display:block;height:20vh;width:auto;max-width:66vw;}
#banner .faixa{width:16vw;height:1vh;background:var(--amarelo);border-radius:1vh;margin-top:5vh;}
#banner .nota{color:#fff;font-size:2.8vh;margin-top:3vh;text-transform:uppercase;letter-spacing:.5vw;opacity:.92;}

#painel{width:100%;height:100%;display:none;flex-direction:column;padding:3.2vh 3.2vw;}
#topo{height:15vh;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:.9vh solid var(--amarelo);box-shadow:0 .4vh 1.2vh rgba(0,0,0,.25);border-radius:1.2vh 1.2vh 0 0;}
#topo img{height:9.5vh;}
#relogio{text-align:right;color:var(--azul);line-height:1;}
#hora{font-size:5.4vh;font-weight:bold;}
#data{font-size:2.3vh;font-weight:bold;text-transform:uppercase;letter-spacing:.15vw;color:#4a6bbf;margin-top:.6vh;}
#corpo{flex:1;padding:2vh 0;overflow:hidden;position:relative;}

/* ===== CENA TABELA ===== */
#grade{display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.4vh 1.6vw;transition:opacity .4s ease;}
.catband{width:100%;color:#fff;font-size:3.4vh;font-weight:bold;text-transform:uppercase;letter-spacing:.2vw;padding:.4vh .4vw 1vh;border-bottom:.35vh solid var(--amarelo);margin-top:.6vh;display:flex;align-items:center;gap:1vw;}
.catband:before{content:"";width:1.1vw;height:3.4vh;background:var(--amarelo);border-radius:.5vh;}
.card{width:calc(50% - .8vw);background:linear-gradient(180deg,var(--amarelo-claro),var(--amarelo));border-radius:1.6vh;padding:1.6vh 1.8vw;display:flex;align-items:center;justify-content:space-between;box-shadow:0 .6vh 1.6vh rgba(0,0,0,.28);overflow:hidden;}
.card .nome{font-size:3.1vh;font-weight:bold;color:var(--azul-txt);line-height:1.1;flex:1;padding-right:1vw;text-transform:uppercase;}
.card .tag{display:inline-block;background:var(--vermelho);color:#fff;font-size:1.9vh;font-weight:900;padding:.1vh .8vw;border-radius:.6vh;margin-right:.6vw;vertical-align:middle;}
.card .bloco{display:flex;align-items:baseline;white-space:nowrap;}
.card .cifra{font-size:2.6vh;font-weight:bold;color:var(--vermelho);margin-right:.3vw;}
.card .preco{font-size:5.4vh;font-weight:900;color:var(--vermelho);line-height:1;}
.card .medida{font-size:2.2vh;font-weight:bold;color:#7a5c00;margin-left:.5vw;align-self:flex-end;margin-bottom:.6vh;}
.card.promo{background:linear-gradient(180deg,#ff2a33,#e60012);box-shadow:0 .6vh 2vh rgba(230,0,18,.5);}
.card.promo .nome{color:#fff;}.card.promo .tag{background:#ffe14d;color:#c00;}
.card.promo .cifra,.card.promo .preco{color:#ffe14d;}.card.promo .medida{color:#ffe7a0;}

/* ===== CENA OFERTA (cartao quadrado amarelo, fundo azul) ===== */
#ofertas{display:none;height:100%;transition:opacity .4s ease;}
.poster{height:100%;display:flex;align-items:center;justify-content:center;}
.quad{width:88vw;max-width:88vw;height:64vh;background:linear-gradient(180deg,var(--amarelo-claro),var(--amarelo));border-radius:3vh;box-shadow:0 1.2vh 4vh rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vh 5vw;}
.quad .sel{background:var(--vermelho);color:#fff;font-size:4.6vh;font-weight:900;padding:1vh 4vw;border-radius:6vh;text-transform:uppercase;letter-spacing:.3vw;margin-bottom:2vh;box-shadow:0 .4vh 1.2vh rgba(0,0,0,.25);animation:pisca 1.1s ease-in-out infinite;}
.quad .nome{color:#111;font-size:6vh;line-height:1.02;text-transform:uppercase;font-family:'Pincel','Arial Black',Arial,sans-serif;word-break:break-word;max-width:100%;}
.quad .preco{margin-top:1.5vh;display:flex;align-items:flex-start;justify-content:center;color:var(--vermelho);font-family:'Pincel','Arial Black',Arial,sans-serif;}
.quad .rs{font-size:6vh;margin-top:2.5vh;margin-right:.5vw;}
.quad .val{font-size:19vh;line-height:.78;}
.quad .cent{font-size:9vh;vertical-align:super;}
.quad .kg{font-size:4vh;align-self:flex-end;margin-bottom:2.5vh;margin-left:.6vw;color:#5a4b00;}

#rodape{height:6vh;background:var(--amarelo);display:flex;align-items:center;overflow:hidden;border-radius:0 0 1.2vh 1.2vh;}
#ticker{white-space:nowrap;color:var(--azul);font-size:2.6vh;font-weight:bold;text-transform:uppercase;will-change:transform;}
#pag{position:absolute;right:1vw;bottom:0;color:#cdd8f5;font-size:2vh;font-weight:bold;}
</style>
</head>

    <div id="relogio"><div id="hora">--:--</div><div id="data">--</div></div>
  </div>
  <div id="corpo">
    <div id="grade"></div>
    <div id="ofertas"></div>
    <div id="pag"></div>
  </div>
  <div id="rodape"><div id="ticker"></div></div>
</div>
<script>
var CFG={server:"http://10.6.1.253:9001/tv",cod_tv:1,titulo:"Acougue",refreshMs:45000,pageMs:12000};
if(window.TV_CONFIG){if(TV_CONFIG.server)CFG.server=TV_CONFIG.server;if(TV_CONFIG.cod_tv)CFG.cod_tv=TV_CONFIG.cod_tv;if(TV_CONFIG.titulo)CFG.titulo=TV_CONFIG.titulo;}
var MENSAGENS=["WR Supermercado","Ofertas do Acougue","Qualidade todo dia pra sua familia","Aceitamos PIX e cartoes"];
document.getElementById('ticker').innerHTML="  •  "+MENSAGENS.join("    •    ")+"    •  "+MENSAGENS.join("    •    ");
function banner(){document.getElementById('banner').style.display='flex';document.getElementById('painel').style.display='none';}
function painel(){document.getElementById('banner').style.display='none';document.getElementById('painel').style.display='flex';}
function xhrGet(u,ok,fail){try{var x=new XMLHttpRequest();x.open("GET",u,true);x.timeout=8000;x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){fail();}}else{fail();}}};x.ontimeout=fail;x.onerror=fail;x.send();}catch(e){fail();}}
function dois(n){return n<10?"0"+n:""+n;}
var DIAS=["DOMINGO","SEGUNDA","TERCA","QUARTA","QUINTA","SEXTA","SABADO"];var MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function tickRelogio(){var d=new Date();document.getElementById('hora').innerHTML=dois(d.getHours())+":"+dois(d.getMinutes());document.getElementById('data').innerHTML=DIAS[d.getDay()]+" "+dois(d.getDate())+" "+MESES[d.getMonth()];}

var LINHAS=[],PROMOS=[];
function montar(dados){var l=[],pr=[],lastCat=null;for(var i=0;i<dados.length;i++){var c=dados[i];if(!c.produtos||!c.produtos.length)continue;if(c.categoria!==lastCat){l.push({tipo:"cat",texto:c.categoria});lastCat=c.categoria;}for(var j=0;j<c.produtos.length;j++){var o={tipo:"prod",nome:c.produtos[j],valor:c.valor?c.valor[j]:"",medida:c.medida?c.medida[j]:"",promo:c.promocao&&(c.promocao[j]=="1"||c.promocao[j]===1)};l.push(o);if(o.promo)pr.push(o);}}LINHAS=l;PROMOS=pr;}
function elCat(t){var d=document.createElement('div');d.className='catband';d.innerHTML=t;return d;}
function elProd(p){var d=document.createElement('div');d.className='card'+(p.promo?' promo':'');var tag=p.promo?'<span class="tag">OFERTA</span>':'';d.innerHTML='<div class="nome">'+tag+p.nome+'</div><div class="bloco"><span class="cifra">R$</span><span class="preco">'+p.valor+'</span><span class="medida">'+p.medida+'</span></div>';return d;}

var PAGINAS=[];
function paginar(){PAGINAS=[];var grade=document.getElementById('grade');var corpo=document.getElementById('corpo');var alturaMax=corpo.clientHeight-10;var vis=grade.style.display;grade.style.display='flex';grade.innerHTML="";var atual=[];for(var i=0;i<LINHAS.length;i++){var L=LINHAS[i];var el=(L.tipo==="cat")?elCat(L.texto):elProd(L);grade.appendChild(el);if(grade.offsetHeight>alturaMax&&atual.length>0){grade.removeChild(el);PAGINAS.push(atual.slice());atual=[L];grade.innerHTML="";grade.appendChild(el);}else{atual.push(L);}}if(atual.length)PAGINAS.push(atual.slice());if(!PAGINAS.length)PAGINAS=[[]];grade.style.display=vis;}

/* cartaz de 1 promocao */
function limpaNome(n){return (n||'').replace(/\s*(KG|UN|UNID|UND|LT|L|PCT|CX|DZ)\s*$/i,'');}
function posterHTML(p){
  var nome=limpaNome(p.nome);var v=p.valor||"",intp=v,cent="";var ci=v.indexOf(',');if(ci>=0){intp=v.slice(0,ci);cent=v.slice(ci);}
  var med=(p.medida||'').toLowerCase();
  return '<div class="poster"><div class="quad">'+
    '<div class="sel">Oferta</div>'+
    '<div class="nome">'+nome+'</div>'+
    '<div class="preco"><span class="rs">R$</span><span class="val">'+intp+'<span class="cent">'+cent+'</span></span><span class="kg">'+med+'</span></div>'+
    '</div></div>';
}

var cena=0;
function totalCenas(){return PAGINAS.length+PROMOS.length;}
function mostrarTabela(idx){
  document.getElementById('ofertas').style.display='none';
  var grade=document.getElementById('grade');grade.style.display='flex';grade.style.opacity=0;
  setTimeout(function(){var p=PAGINAS[idx]||[];grade.innerHTML="";for(var i=0;i<p.length;i++){var L=p[i];grade.appendChild(L.tipo==="cat"?elCat(L.texto):elProd(L));}grade.style.opacity=1;},180);
}
function mostrarPoster(pidx){
  document.getElementById('grade').style.display='none';
  var of=document.getElementById('ofertas');of.style.display='block';of.style.opacity=0;
  of.innerHTML=posterHTML(PROMOS[pidx]);
  setTimeout(function(){of.style.opacity=1;},180);
}
function renderCena(){
  var nt=PAGINAS.length;
  document.getElementById('pag').innerHTML=totalCenas()>1?("Tela "+(cena+1)+"/"+totalCenas()):"";
  if(cena>=nt && PROMOS.length){mostrarPoster(cena-nt);}else{mostrarTabela(cena);}
}
function virar(){if(totalCenas()<=1)return;cena=(cena+1)%totalCenas();renderCena();}
function carregar(){xhrGet(CFG.server+"/tabela/produtos.php?cod_tv="+CFG.cod_tv,function(dados){montar(dados);if(!LINHAS.length){banner();return;}painel();paginar();if(cena>=totalCenas())cena=0;renderCena();},function(){banner();});}
var tx=0;function rolarTicker(){var t=document.getElementById('ticker');tx-=1.3;if(Math.abs(tx)>t.scrollWidth/2)tx=0;t.style.transform="translateX("+tx+"px)";}
/* liga/desliga a tela (fica preta) por horario. Pode vir do config.json (TV_CONFIG.horario) */
var DEF_HOR={semana:{liga:"07:55",desliga:"19:20"},domingo:{liga:"07:55",desliga:"12:25"}};
var HOR=(window.TV_CONFIG&&TV_CONFIG.horario)?TV_CONFIG.horario:DEF_HOR;
function _m(s){var p=(s||"0:0").split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function checkHorario(){var d=new Date();var reg=(d.getDay()===0)?(HOR.domingo||DEF_HOR.domingo):(HOR.semana||DEF_HOR.semana);var ag=d.getHours()*60+d.getMinutes();var on=(ag>=_m(reg.liga)&&ag<_m(reg.desliga));document.getElementById('desliga').style.display=on?'none':'block';}
banner();tickRelogio();carregar();checkHorario();
setInterval(checkHorario,20000);
setInterval(tickRelogio,1000);setInterval(carregar,CFG.refreshMs);setInterval(virar,CFG.pageMs);setInterval(rolarTicker,30);
window.onresize=function(){if(LINHAS.length&&document.getElementById('painel').style.display!=='none'){paginar();renderCena();}};
</script>
