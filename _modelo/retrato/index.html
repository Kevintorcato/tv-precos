<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WR Supermercado - Vertical</title>
<style>
/* Unidades SWAPADAS: o conteudo fica dentro de #rot (girado 90).
   Dentro dele: 1vh = 1% da largura-retrato ; 1vw = 1% da altura-retrato. */
:root{--azul:#0b3fa8;--azul-esc:#082a73;--azul-txt:#0a2a66;--amarelo:#ffc400;--amarelo-claro:#ffd83a;--vermelho:#d81f26;}
@font-face{font-family:'Pincel';src:url('https://raw.githubusercontent.com/Kevintorcato/tv-precos/main/assets/fonts/PermanentMarker.ttf') format('truetype');font-display:swap;}
@keyframes pisca{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.1);}}
*{margin:0;padding:0;box-sizing:border-box;}
#desliga{position:fixed;inset:0;background:#000;z-index:99999;display:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#082a73;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:none;}

/* wrapper que gira a pagina 90 (geometria em unidades REAIS do viewport) */
#rot{position:absolute;top:100%;left:0;transform-origin:left top;transform:rotate(-90deg);
  width:100vh;height:100vw;overflow:hidden;background:linear-gradient(160deg,var(--azul),var(--azul-esc));}

#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--azul),var(--azul-esc));}
#banner .logobox{background:#fff;border-radius:3vh;padding:5vw 6vh;box-shadow:0 1.5vw 5vw rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
#banner .logobox img{display:block;width:62vh;max-width:78vh;height:auto;}
#banner .faixa{width:40vh;height:1vw;background:var(--amarelo);border-radius:1vw;margin-top:5vw;}
#banner .nota{color:#fff;font-size:3.6vh;margin-top:3vw;text-transform:uppercase;letter-spacing:.5vh;opacity:.92;}

#painel{width:100%;height:100%;display:none;flex-direction:column;padding:2.5vw 3vh;}
#topo{min-height:8vw;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:1.5vw 3vh;border-bottom:.8vw solid var(--amarelo);box-shadow:0 .4vw 1.2vw rgba(0,0,0,.25);border-radius:1.5vh 1.5vh 0 0;}
#topo img{height:7vh;}
#relogio{text-align:right;color:var(--azul);line-height:1;}
#hora{font-size:5vh;font-weight:bold;}
#data{font-size:2.2vh;font-weight:bold;text-transform:uppercase;color:#4a6bbf;margin-top:.5vw;}
#corpo{flex:1;padding:2vw 0;overflow:hidden;position:relative;}

#grade{display:flex;flex-direction:column;gap:1.4vw;transition:opacity .4s ease;}
.catband{color:#fff;font-size:4.4vh;font-weight:bold;text-transform:uppercase;letter-spacing:.2vh;padding:.4vw 0 1vw;border-bottom:.35vw solid var(--amarelo);margin-top:.6vw;display:flex;align-items:center;gap:2vh;}
.catband:before{content:"";width:2.4vh;height:4.4vh;background:var(--amarelo);border-radius:.5vh;}
.card{width:100%;background:linear-gradient(180deg,var(--amarelo-claro),var(--amarelo));border-radius:2vh;padding:1.8vw 4vh;display:flex;align-items:center;justify-content:space-between;box-shadow:0 .6vw 1.6vw rgba(0,0,0,.28);overflow:hidden;}
.card .nome{font-size:4.4vh;font-weight:bold;color:var(--azul-txt);line-height:1.05;flex:1;padding-right:3vh;text-transform:uppercase;}
.card .tag{display:inline-block;background:var(--vermelho);color:#fff;font-size:2.6vh;font-weight:900;padding:.1vw 1.5vh;border-radius:1vh;margin-right:1.5vh;vertical-align:middle;}
.card .bloco{display:flex;align-items:baseline;white-space:nowrap;}
.card .cifra{font-size:3.6vh;font-weight:bold;color:var(--vermelho);margin-right:.5vh;}
.card .preco{font-size:7vh;font-weight:900;color:var(--vermelho);line-height:1;}
.card .medida{font-size:2.8vh;font-weight:bold;color:#7a5c00;margin-left:1vh;align-self:flex-end;margin-bottom:.4vw;}
.card.promo{background:linear-gradient(180deg,#ff2a33,#e60012);box-shadow:0 .6vw 2vw rgba(230,0,18,.5);}
.card.promo .nome{color:#fff;}.card.promo .tag{background:#ffe14d;color:#c00;}
.card.promo .cifra,.card.promo .preco{color:#ffe14d;}.card.promo .medida{color:#ffe7a0;}

#ofertas{display:none;height:100%;transition:opacity .4s ease;}
.poster{height:100%;display:flex;align-items:center;justify-content:center;}
.quad{width:90vh;max-width:90vh;min-height:62vw;background:linear-gradient(180deg,var(--amarelo-claro),var(--amarelo));border-radius:3vh;box-shadow:0 1.2vw 4vw rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw 6vh;}
.quad .sel{background:var(--vermelho);color:#fff;font-size:6vh;font-weight:900;padding:1vw 7vh;border-radius:8vh;text-transform:uppercase;letter-spacing:.3vh;margin-bottom:3vw;box-shadow:0 .4vw 1.2vw rgba(0,0,0,.25);animation:pisca 1.1s ease-in-out infinite;}
.quad .nome{color:#111;font-size:9vh;line-height:1.02;text-transform:uppercase;font-family:'Pincel','Arial Black',Arial,sans-serif;word-break:break-word;}
.quad .preco{margin-top:2vw;display:flex;align-items:flex-start;justify-content:center;color:var(--vermelho);font-family:'Pincel','Arial Black',Arial,sans-serif;}
.quad .rs{font-size:8vh;margin-top:3vh;margin-right:1vh;}
.quad .val{font-size:28vh;line-height:.78;}
.quad .cent{font-size:13vh;vertical-align:super;}
.quad .kg{font-size:5vh;align-self:flex-end;margin-bottom:3vh;margin-left:1vh;color:#5a4b00;}

#rodape{min-height:5vw;background:var(--amarelo);display:flex;align-items:center;overflow:hidden;border-radius:0 0 1.5vh 1.5vh;}
#ticker{white-space:nowrap;color:var(--azul);font-size:3.6vh;font-weight:bold;text-transform:uppercase;will-change:transform;}
#pag{position:absolute;right:1vh;bottom:0;color:#cdd8f5;font-size:2.4vh;font-weight:bold;}
</style>
</head>
<body>
<div id="desliga"></div>
<div id="rot">
  <div id="banner">
    <div class="logobox"><img src="https://raw.githubusercontent.com/Kevintorcato/tv-precos/main/assets/logo-wr.png" alt="WR"></div>
    <div class="faixa"></div>
    <div class="nota">Ofertas em instantes</div>
  </div>
  <div id="painel">
    <div id="topo">
      <img src="https://raw.githubusercontent.com/Kevintorcato/tv-precos/main/assets/logo-wr.png" alt="WR Supermercado">
      <div id="relogio"><div id="hora">--:--</div><div id="data">--</div></div>
    </div>
    <div id="corpo"><div id="grade"></div><div id="ofertas"></div><div id="pag"></div></div>
    <div id="rodape"><div id="ticker"></div></div>
  </div>
</div>
<script>
var CFG={server:"http://10.6.1.253:9001/tv",cod_tv:1,titulo:"Acougue",refreshMs:45000,pageMs:12000};
if(window.TV_CONFIG){if(TV_CONFIG.server)CFG.server=TV_CONFIG.server;if(TV_CONFIG.cod_tv)CFG.cod_tv=TV_CONFIG.cod_tv;if(TV_CONFIG.titulo)CFG.titulo=TV_CONFIG.titulo;}
var MENSAGENS=["WR Supermercado","Ofertas do Acougue","Qualidade todo dia pra sua familia","Aceitamos PIX e cartoes"];
document.getElementById('ticker').innerHTML="  •  "+MENSAGENS.join("    •    ")+"    •  "+MENSAGENS.join("    •    ");
function banner(){document.getElementById('banner').style.display='flex';document.getElementById('painel').style.display='none';}
function painel(){document.getElementById('banner').style.display='none';document.getElementById('painel').style.display='flex';}
function xhrGet(u,ok,fail){try{var x=new XMLHttpRequest();x.open("GET",u,true);x.timeout=8000;x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){fail();}}else{fail();}}};x.ontimeout=fail;x.onerror=fail;x.send();}catch(e){fail();}}
function dois(n){return n<10?"0"+n:""+n;}
var DIAS=["DOMINGO","SEGUNDA","TERCA","QUARTA","QUINTA","SEXTA","SABADO"];var MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function tickRelogio(){var d=new Date();document.getElementById('hora').innerHTML=dois(d.getHours())+":"+dois(d.getMinutes());document.getElementById('data').innerHTML=DIAS[d.getDay()]+" "+dois(d.getDate())+" "+MESES[d.getMonth()];}
var LINHAS=[],PROMOS=[];
function montar(dados){var l=[],pr=[],lastCat=null;for(var i=0;i<dados.length;i++){var c=dados[i];if(!c.produtos||!c.produtos.length)continue;if(c.categoria!==lastCat){l.push({tipo:"cat",texto:c.categoria});lastCat=c.categoria;}for(var j=0;j<c.produtos.length;j++){var o={tipo:"prod",nome:c.produtos[j],valor:c.valor?c.valor[j]:"",medida:c.medida?c.medida[j]:"",promo:c.promocao&&(c.promocao[j]=="1"||c.promocao[j]===1)};l.push(o);if(o.promo)pr.push(o);}}LINHAS=l;PROMOS=pr;}
function elCat(t){var d=document.createElement('div');d.className='catband';d.innerHTML=t;return d;}
function elProd(p){var d=document.createElement('div');d.className='card'+(p.promo?' promo':'');var tag=p.promo?'<span class="tag">OFERTA</span>':'';d.innerHTML='<div class="nome">'+tag+p.nome+'</div><div class="bloco"><span class="cifra">R$</span><span class="preco">'+p.valor+'</span><span class="medida">'+p.medida+'</span></div>';return d;}
var PAGINAS=[];
function paginar(){PAGINAS=[];var grade=document.getElementById('grade');var corpo=document.getElementById('corpo');var alturaMax=corpo.clientHeight-10;var vis=grade.style.display;grade.style.display='flex';grade.innerHTML="";var atual=[];for(var i=0;i<LINHAS.length;i++){var L=LINHAS[i];var el=(L.tipo==="cat")?elCat(L.texto):elProd(L);grade.appendChild(el);if(grade.offsetHeight>alturaMax&&atual.length>0){grade.removeChild(el);PAGINAS.push(atual.slice());atual=[L];grade.innerHTML="";grade.appendChild(el);}else{atual.push(L);}}if(atual.length)PAGINAS.push(atual.slice());if(!PAGINAS.length)PAGINAS=[[]];grade.style.display=vis;}
function limpaNome(n){return (n||'').replace(/\s*(KG|UN|UNID|UND|LT|L|PCT|CX|DZ)\s*$/i,'');}
function posterHTML(p){var nome=limpaNome(p.nome);var v=p.valor||"",intp=v,cent="";var ci=v.indexOf(',');if(ci>=0){intp=v.slice(0,ci);cent=v.slice(ci);}var med=(p.medida||'').toLowerCase();return '<div class="poster"><div class="quad"><div class="sel">Oferta</div><div class="nome">'+nome+'</div><div class="preco"><span class="rs">R$</span><span class="val">'+intp+'<span class="cent">'+cent+'</span></span><span class="kg">'+med+'</span></div></div></div>';}
var cena=0;
function totalCenas(){return PAGINAS.length+PROMOS.length;}
function mostrarTabela(idx){document.getElementById('ofertas').style.display='none';var grade=document.getElementById('grade');grade.style.display='flex';grade.style.opacity=0;setTimeout(function(){var p=PAGINAS[idx]||[];grade.innerHTML="";for(var i=0;i<p.length;i++){var L=p[i];grade.appendChild(L.tipo==="cat"?elCat(L.texto):elProd(L));}grade.style.opacity=1;},180);}
function mostrarPoster(pidx){document.getElementById('grade').style.display='none';var of=document.getElementById('ofertas');of.style.display='block';of.style.opacity=0;of.innerHTML=posterHTML(PROMOS[pidx]);setTimeout(function(){of.style.opacity=1;},180);}
function renderCena(){var nt=PAGINAS.length;document.getElementById('pag').innerHTML=totalCenas()>1?("Tela "+(cena+1)+"/"+totalCenas()):"";if(cena>=nt && PROMOS.length){mostrarPoster(cena-nt);}else{mostrarTabela(cena);}}
function virar(){if(totalCenas()<=1)return;cena=(cena+1)%totalCenas();renderCena();}
function carregar(){xhrGet(CFG.server+"/tabela/produtos.php?cod_tv="+CFG.cod_tv,function(dados){montar(dados);if(!LINHAS.length){banner();return;}painel();paginar();if(cena>=totalCenas())cena=0;renderCena();},function(){banner();});}
var tx=0;function rolarTicker(){var t=document.getElementById('ticker');tx-=1.3;if(Math.abs(tx)>t.scrollWidth/2)tx=0;t.style.transform="translateX("+tx+"px)";}
var DEF_HOR={semana:{liga:"07:55",desliga:"19:20"},domingo:{liga:"07:55",desliga:"12:25"}};
var HOR=(window.TV_CONFIG&&TV_CONFIG.horario)?TV_CONFIG.horario:DEF_HOR;
function _m(s){var p=(s||"0:0").split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function checkHorario(){var d=new Date();var reg=(d.getDay()===0)?(HOR.domingo||DEF_HOR.domingo):(HOR.semana||DEF_HOR.semana);var ag=d.getHours()*60+d.getMinutes();var on=(ag>=_m(reg.liga)&&ag<_m(reg.desliga));document.getElementById('desliga').style.display=on?'none':'block';}
banner();tickRelogio();carregar();checkHorario();
setInterval(checkHorario,20000);
setInterval(tickRelogio,1000);setInterval(carregar,CFG.refreshMs);setInterval(virar,CFG.pageMs);setInterval(rolarTicker,30);
window.onresize=function(){if(LINHAS.length&&document.getElementById('painel').style.display!=='none'){paginar();renderCena();}};
</script>
</body>
</html>
